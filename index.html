    <meta charset="UTF-8" />

    <meta property="og:title" content="ALF Automação - GMB Sales Engine" />
    <meta property="og:description" content="Sistema de inteligência de vendas locais para prospectar empresas sem site e com baixas avaliações, gerando modelos de placas NFC/QR-Code, landing pages interativas e scripts de WhatsApp de alta conversão." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Mobile Web App Capable (PWA) Settings -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALF Vendas" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <script>
      // Suppress benign Vite HMR WebSocket connection errors in cloud proxy environment
      (function() {
        var isHmrError = function(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message) || String(e))) || '';
          return msg.indexOf('WebSocket') !== -1 ||
                 msg.indexOf('@vite/client') !== -1 ||
                 msg.indexOf('vite') !== -1 && msg.indexOf('ws') !== -1;
        };
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (isHmrError(str)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          if (isHmrError(event && (event.error || event.message || event))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (isHmrError(event && (event.reason || event))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();

      // Immediate redirect interceptor for direct physical plate scans (never inside iframe preview)
      (function() {
        try {
          if (window.self !== window.top) return; // Prevent breaking preview iframes
          var p = window.location.pathname || '';
          if (/^\/(r|redirect|nfc|tag)\//i.test(p)) {
            var cleanId = p.replace(/^\/(r|redirect|nfc|tag)\//i, '').replace(/[^a-zA-Z0-9_\-]/g, '').toLowerCase().split('/')[0].split('?')[0];
            if (cleanId) {
              if (cleanId.indexOf('bella') !== -1 || cleanId.indexOf('mesa') !== -1 || cleanId.indexOf('rio') !== -1) {
                window.location.replace('https://search.google.com/local/writereview?placeid=ChIJTTKzQz_Xv5QRjyhnE6zQpyI');
                return;
              }
              if (cleanId.indexOf('suica') !== -1 || cleanId.indexOf('08') !== -1) {
                window.location.replace('https://search.google.com/local/writereview?placeid=ChIJx2ytYDXXv5QRQzIXgn7RRrc');
                return;
              }
              if (cleanId.indexOf('cbcell') !== -1 || cleanId.indexOf('cell') !== -1) {
                window.location.replace('https://search.google.com/local/writereview?placeid=ChIJCyHYx7zXv5QRn264H27HvhY');
                return;
              }
              fetch('/api/resolve-redirect/' + cleanId, { cache: 'no-store' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                  if (data && data.targetUrl) {
                    window.location.replace(data.targetUrl);
                  }
                })
                .catch(function() {});
            }
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
